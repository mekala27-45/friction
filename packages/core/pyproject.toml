[project]
name = "friction-core"
version = "0.1.0"
description = "Shared models, hashing, formats, units, the statement, the manifest and salted tokens"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "structlog>=25.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friction_core"]
