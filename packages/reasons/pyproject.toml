[project]
name = "friction-reasons"
version = "0.1.0"
description = "Reason codes from a fixed table, ranked by TreeSHAP contribution"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "friction-core",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friction_reasons"]
