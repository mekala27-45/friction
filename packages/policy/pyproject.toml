[project]
name = "friction-policy"
version = "0.1.0"
description = "Approve, step up or decline, with the channel deciding what is possible"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "friction-core",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friction_policy"]
