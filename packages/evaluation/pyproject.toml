[project]
name = "friction-evaluation"
version = "0.1.0"
description = "The friction frontier, budgets, cluster bootstrap, Benjamini-Hochberg, interior tests and calibration"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "friction-core",
  "friction-policy",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friction_evaluation"]
