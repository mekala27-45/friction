[project]
name = "friction-api"
version = "0.1.0"
description = "The scoring API with the online store, the decision log and the client budget"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "friction-core",
  "friction-features",
  "friction-models",
  "friction-policy",
  "friction-reasons",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friction_api"]
