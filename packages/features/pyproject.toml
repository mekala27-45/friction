[project]
name = "friction-features"
version = "0.1.0"
description = "Point in time features as one state machine, used by the lakehouse and by the API"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "friction-core",
  "numpy>=2.0",
  "pandas>=2.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friction_features"]
