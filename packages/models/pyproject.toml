[project]
name = "friction-models"
version = "0.1.0"
description = "The rules floors, logistic regression, LightGBM and the Freeman et al. RBA model"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "friction-core",
  "friction-features",
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.6",
  "lightgbm>=4.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friction_models"]
