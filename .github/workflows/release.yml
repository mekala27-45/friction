# A release from a tag: the claim gate must pass on the tagged commit, then the release carries
# RESULTS.md as its notes and the manifest and the evaluation as assets.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag whose release needs its assets"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --no-dev
      - name: The documents match the manifest on the tagged commit
        run: uv run python scripts/check_published_numbers.py
      - name: Registration and gates
        run: |
          uv run python scripts/check_registration.py
          uv run python scripts/check_no_em_dash.py
          uv run python scripts/check_tokens.py
          uv run python scripts/scan_for_planted_identifiers.py
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # A release published by hand from the tag already has its notes; it only needs the assets.
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" results/manifest.json results/evaluation.json --clobber
          else
            gh release create "$TAG" --title "friction $TAG" --notes-file RESULTS.md \
              results/manifest.json results/evaluation.json
          fi
