# The only machine that touches the workspace. It runs every committed request under requests/
# that has no record on the results branch, writes what each produced to runs/<id>/ on that
# branch, and pushes. The build machine reviews the branch and promotes results into main with a
# provenance file (scripts/promote_results.py). Nothing here prints a secret, and the token scan
# in CI fails on anything that looks like one in a tracked file.
name: workspace

on:
  push:
    branches: [main]
    paths: ["requests/**"]
  workflow_dispatch:
    inputs:
      only:
        description: "Run one request id again, even if it has a record"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: workspace
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      FRICTION_SALT: ${{ secrets.FRICTION_SALT }}
      TF_STATE_CONN: ${{ secrets.TF_STATE_CONN }}
      PG_CONN_STR: ${{ secrets.TF_STATE_CONN }}
      # The live API checks (request kind api_check): the replay key is a secret, the URL is not.
      FRICTION_REPLAY_KEY: ${{ secrets.FRICTION_REPLAY_KEY }}
      FRICTION_API_URL: ${{ vars.FRICTION_API_URL }}
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 1

      - name: The workspace secrets are set
        run: |
          missing=""
          [ -n "$DATABRICKS_HOST" ] || missing="$missing DATABRICKS_HOST"
          [ -n "$DATABRICKS_TOKEN" ] || missing="$missing DATABRICKS_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::missing Actions secrets:$missing"
            exit 1
          fi
          case "$DATABRICKS_HOST" in
            https://*) ;;
            *) echo "::error::DATABRICKS_HOST must start with https://"; exit 1 ;;
          esac

      - name: Results branch as a worktree
        run: |
          git config user.name "friction-workspace"
          git config user.email "friction-workspace@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin results >/dev/null; then
            git fetch --depth 1 origin results:results
            git worktree add results-branch results
          else
            git worktree add --orphan -b results results-branch
          fi
          mkdir -p results-branch/runs

      - name: Free disk for the source files
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      # The full open source run holds a 10 GB Spark heap beside the Python side on a 16 GB runner.
      # Request 35b lost its runner at the start of the model step with no log; swap absorbs a peak
      # instead of starving the runner process. Never fatal: a runner without room keeps its own.
      - name: Swap for the memory peaks
        run: |
          have=$(swapon --show=SIZE --noheadings --bytes | awk '{s += $1} END {print s + 0}')
          if [ "$have" -lt 8000000000 ]; then
            for f in /mnt/friction.swap /friction.swap; do
              if sudo fallocate -l 8G "$f" 2>/dev/null && sudo chmod 600 "$f" && sudo mkswap "$f" >/dev/null \
                && sudo swapon "$f"; then
                break
              fi
              sudo rm -f "$f"
            done
          fi
          free -h

      - name: Which optional secrets are set (names only)
        env:
          HAS_SALT: ${{ secrets.FRICTION_SALT != '' }}
          HAS_TF: ${{ secrets.TF_STATE_CONN != '' }}
          HAS_DB: ${{ secrets.DATABASE_URL != '' }}
        run: |
          mkdir -p results-branch/runs
          printf '{"FRICTION_SALT": %s, "TF_STATE_CONN": %s, "DATABASE_URL": %s, "checked_in_run": "%s"}\n' \
            "$HAS_SALT" "$HAS_TF" "$HAS_DB" "$GITHUB_RUN_ID" > results-branch/secrets_present.json
          cat results-branch/secrets_present.json

      # Java for the open source engine: a portable request runs it here, with the workspace salt.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen --extra workspace --extra spark --extra sequence --no-dev

      - uses: databricks/setup-cli@9625fdde9ba2607df0087e0d3ec7449198bf2180  # main on 1 Nov 2026

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_wrapper: false

      - name: Run pending requests
        id: requests
        run: |
          set +e
          uv run --no-sync python -m friction_workspace.run --out results-branch/runs ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Push the results branch
        if: always()
        run: |
          cd results-branch
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new on the results branch"
          else
            git commit -q -m "results: requests run in ${GITHUB_RUN_ID} from ${GITHUB_SHA::7}"
            git push origin results
          fi

      - name: Open an issue for each monitor breach
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd results-branch
          for f in $(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '/alerts.json$' || true); do
            id=$(echo "$f" | sed -E 's#^runs/([^/]+)/.*#\1#')
            body=$(python3 -c "import json,sys; rows=json.load(open(sys.argv[1])); print('\n'.join('- ' + r['severity'] + ' ' + r['check'] + ' ' + r['scope'] + ': ' + r['note'] for r in rows))" "$f")
            [ -z "$body" ] && continue
            gh issue create --repo "$GITHUB_REPOSITORY" --title "monitor: ${id}" \
              --body "$(printf '%s\n\nRun: %s/%s/actions/runs/%s\nRunbook: docs/runbooks/ingestion.md' "$body" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          done

      - name: Fail if a request failed
        if: steps.requests.outputs.status != '0'
        run: exit 1
